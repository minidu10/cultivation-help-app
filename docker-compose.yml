# One compose file for both environments.
# Which services start is decided by COMPOSE_PROFILES in .env:
#   COMPOSE_PROFILES=local  ->  db + backend + ai-service   (frontend runs via `npm run dev`)
#   COMPOSE_PROFILES=prod   ->  backend + ai-service + frontend (db is a managed service)
# The command is the same in both cases:  docker compose up -d --build

# Docker's default json-file driver has no size cap, so container logs grow
# until the root volume is full. Every service inherits this.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Local-only database. Not started under the prod profile, where DB_URL
  # points at a managed Postgres instead.
  db:
    # Keep this matched to the major version the managed database runs, so
    # local development is never a version behind production. Changing it
    # requires recreating the pgdata volume: Postgres refuses to start on a
    # data directory written by a different major version.
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: cultivation_db
    profiles: ["local"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Deliberately NOT tied to DB_USERNAME/DB_PASSWORD. Those describe where
      # the application connects, which may be a managed database; reusing them
      # here made this container chase a role it never had the moment DB_URL
      # pointed at Neon.
      POSTGRES_DB: ${POSTGRES_DB:-cultivation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host port 5434 by default: 5432 and 5433 are commonly taken by a
      # locally installed PostgreSQL. Containers still reach it on 5432.
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cultivation}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Catches every email the app sends and shows it at http://localhost:8025
  # instead of delivering it. Local only - production uses a real SMTP relay.
  mailpit:
    image: axllent/mailpit
    container_name: cultivation_mailpit
    profiles: ["local"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web inbox
      - "1025:1025"                       # SMTP

  # No depends_on the db: a no-profile service depending on a profiled one
  # behaves inconsistently across Compose versions, and the backend already
  # waits one out via flyway connect-retries + hikari initialization-fail-timeout.
  backend:
    build: ./backend
    container_name: cultivation_backend
    restart: unless-stopped
    logging: *default-logging
    # Sized for a 1 GB free-tier VM with Postgres hosted off-box.
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    ports:
      # HOST_BIND is 127.0.0.1 in production, so the API is reachable only
      # through nginx - never directly over plain HTTP from the internet.
      - "${HOST_BIND:-0.0.0.0}:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      FLYWAY_CONNECT_RETRIES: ${FLYWAY_CONNECT_RETRIES:-10}
      FLYWAY_CONNECT_RETRIES_INTERVAL: ${FLYWAY_CONNECT_RETRIES_INTERVAL:-5s}
      # Deliberately no default - a missing secret must fail loudly.
      APP_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      OPENWEATHER_BASE_URL: ${OPENWEATHER_BASE_URL:-https://api.openweathermap.org}
      # Containers default to UTC. Reminders are written as plain LocalDateTime,
      # so without this a 07:00 reminder would fire at 01:30 Sri Lanka time.
      TZ: ${TZ:-Asia/Colombo}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SHOW_SQL: ${SHOW_SQL:-false}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-AgroMaster <agromaster026@gmail.com>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      REMINDER_CRON: ${REMINDER_CRON:-0 0 7 * * *}
      REMINDER_LEAD_DAYS: ${REMINDER_LEAD_DAYS:-2,1}
      REMINDER_EMAIL_ENABLED: ${REMINDER_EMAIL_ENABLED:-true}

  ai-service:
    build: ./ai-service
    container_name: cultivation_ai
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ai/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    ports:
      # Local debugging only. The backend reaches this over the compose
      # network, so in production it binds to loopback and nothing else.
      - "${HOST_BIND:-0.0.0.0}:8000:8000"
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      AI_MODEL: ${AI_MODEL:-gemini-3.6-flash}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-4096}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-low}
      AI_ALLOWED_ORIGINS: ${AI_ALLOWED_ORIGINS:-}

  # Production only. nginx.conf terminates SSL with Let's Encrypt certs,
  # so this cannot start locally; use the Vite dev server instead.
  frontend:
    build: ./frontend-web
    container_name: cultivation_frontend
    profiles: ["prod"]
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    environment:
      # Substituted into nginx.conf.template at container start. A forgotten
      # DOMAIN is caught immediately: nginx looks for a certificate under
      # /etc/letsencrypt/live/localhost/ and refuses to start without one.
      DOMAIN: ${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot for Let's Encrypt HTTP-01 renewal.
      - certbot-webroot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy

volumes:
  pgdata:
  certbot-webroot:
