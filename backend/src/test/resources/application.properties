# Test context configuration.
#
# Integration tests run against a real Postgres started by Testcontainers (see
# IntegrationTest), so the Flyway migrations run exactly as they do in
# production. The datasource URL is supplied by the test base class.

# Hibernate checks every entity against the migrated schema at startup, so an
# entity and a migration drifting apart fails the build instead of production.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JwtUtil refuses to start on a missing, placeholder or short secret.
app.jwt.secret=ci-test-signing-key-not-used-anywhere-real-000000

# Nothing outbound should be reached from a test.
app.ai.service-url=http://localhost:1
app.google.client-id=
weather.openweather.api-key=
app.reminders.email-enabled=false
spring.mail.host=localhost
spring.mail.port=2525

# Off by default so tests do not trip over each other's counters;
# RateLimitIntegrationTest switches it on for itself.
app.rate-limit.enabled=false

logging.level.com.cultivation=WARN
