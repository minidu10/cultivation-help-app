# Test context configuration.
#
# AppApplicationTests is a @SpringBootTest, so it starts the whole application.
# Without these it needs a real Postgres, a valid signing key and a mail server,
# none of which exist on a CI runner. In-memory H2 plus placeholder credentials
# let the context load, which is what the test is actually checking: that every
# bean wires together.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migrations are Postgres-specific; let Hibernate build the schema here.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JwtUtil refuses to start on a missing, placeholder or short secret.
app.jwt.secret=ci-test-signing-key-not-used-anywhere-real-000000

# Nothing outbound should be reached from a test.
app.ai.service-url=http://localhost:1
app.google.client-id=
app.reminders.email-enabled=false
spring.mail.host=localhost
spring.mail.port=2525

logging.level.com.cultivation=WARN
