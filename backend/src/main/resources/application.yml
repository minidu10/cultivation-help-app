spring:
  application:
    name: cultivation-help-app
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: 0
      minimum-idle: 1
      maximum-pool-size: 5
      keepalive-time: 30000

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5s}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    # Off by default: pretty-printing every statement to stdout is real CPU
    # and I/O on a small host, and buries the useful log lines.
    # Set SHOW_SQL=true locally when debugging a query.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}

  mail:
    default-encoding: UTF-8
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: 8080

logging:
  level:
    com.cultivation: ${LOG_LEVEL:INFO}

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  jwt:
    # No fallback on purpose: a deployment that forgets this must fail to
    # start rather than boot with a publicly known signing key.
    secret: ${APP_JWT_SECRET:${JWT_SECRET:}}
    expiration: 86400000
  mail:
    from: ${MAIL_FROM:AgroMaster <agromaster2026@gmail.com>}
  ai:
    # Insights are generated backend-side so they can be cached; the browser
    # never calls the AI service for them.
    service-url: ${AI_SERVICE_URL:http://ai-service:8000}
  google:
    # OAuth 2.0 Web client ID from Google Cloud Console.
    # Blank disables Google Sign-In; the button hides itself.
    client-id: ${GOOGLE_CLIENT_ID:}
  verification:
    # A 6-digit code is only a million guesses, so it has to be short-lived,
    # attempt-limited and single-use.
    code-ttl-minutes: ${VERIFICATION_CODE_TTL_MINUTES:10}
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
    # How long after confirming a code the user has to finish registering
    # or complete the password reset.
    completion-window-minutes: ${VERIFICATION_COMPLETION_WINDOW_MINUTES:30}
  reminders:
    email-enabled: ${REMINDER_EMAIL_ENABLED:true}
    # How many days ahead to warn. 2,1 = a notice two days before and again
    # the day before. Add 0 to also mail on the day itself.
    lead-days: ${REMINDER_LEAD_DAYS:2,1}
    # Once a day at 07:00, so a farmer can receive at most one digest per day.
    cron: ${REMINDER_CRON:0 0 7 * * *}

weather:
  openweather:
    base-url: ${OPENWEATHER_BASE_URL:https://api.openweathermap.org}
    api-key: ${OPENWEATHER_API_KEY:}

springdoc:
  # Off by default. An open Swagger UI hands an attacker the full API map,
  # so it is enabled explicitly for local development only.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
  info:
    title: Cultivation Help App API
    version: 1.0.0
    description: Farm management system with AI integration