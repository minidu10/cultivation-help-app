name: Mobile release

# Publishes the Android APK as a GitHub Release.
# Tag a commit `mobile-v<version>` (matching mobile-app/pubspec.yaml) to run it.
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "mobile-v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION"
            exit 1
          fi

      - name: Install
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

      # Without the keystore secrets the APK is signed with the debug key,
      # which is fine for a test build but not for a public release.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secrets set; the APK will be signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=$PWD/android/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://agromaster.duckdns.org/api
          --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
          --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
          --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID

      - name: Name the APK and checksum it
        run: |
          cd build/app/outputs/flutter-apk
          mv app-release.apk "agromaster-${{ steps.ver.outputs.version }}.apk"
          sha256sum "agromaster-${{ steps.ver.outputs.version }}.apk" > "agromaster-${{ steps.ver.outputs.version }}.apk.sha256"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: AgroMaster Android ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            Android app for AgroMaster. Download the APK, allow installs from this source, and open it.
            Verify the download with the `.sha256` file.
          files: |
            mobile-app/build/app/outputs/flutter-apk/agromaster-${{ steps.ver.outputs.version }}.apk
            mobile-app/build/app/outputs/flutter-apk/agromaster-${{ steps.ver.outputs.version }}.apk.sha256

      - name: Keep the APK when run manually
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: agromaster-android
          path: mobile-app/build/app/outputs/flutter-apk/agromaster-*.apk
