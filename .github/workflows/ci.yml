name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes one still running; no point deploying twice.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: minidu10

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Integration tests start Postgres with Testcontainers; the runner's
      # Docker daemon is all they need.
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify
      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          [ -f target/site/jacoco/jacoco.csv ] || exit 0
          # Columns 8 and 9 of the JaCoCo CSV are LINE_MISSED and LINE_COVERED.
          awk -F, 'NR > 1 { missed += $8; covered += $9 }
                   END { printf "### Backend line coverage: %.1f%%\n", 100 * covered / (missed + covered) }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install
        working-directory: frontend-web
        run: npm ci
      - name: Lint
        working-directory: frontend-web
        run: npx eslint src --max-warnings=-1
      - name: Test
        working-directory: frontend-web
        run: npm test
      - name: Build
        working-directory: frontend-web
        run: npm run build

  ai-service:
    name: AI service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.12-slim image the service ships in.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - name: Install
        working-directory: ai-service
        run: pip install -r requirements-dev.txt
      - name: Lint
        working-directory: ai-service
        run: ruff check .
      - name: Test
        working-directory: ai-service
        run: pytest -q

  mobile:
    name: Mobile app checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Install
        run: flutter pub get
      # Generated models are committed so a fresh clone runs without a
      # codegen step; this fails the build if someone forgot to regenerate.
      - name: Generated code is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      # Firebase values are optional secrets; without them the APK is built
      # with push notifications switched off.
      - name: Build APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=https://agromaster.duckdns.org/api
          --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY
          --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID
          --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID
          --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agromaster-android
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

  images:
    name: Publish images
    needs: [backend, frontend, ai-service]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: ./backend
            image: agromaster-backend
          - context: ./ai-service
            image: agromaster-ai
          - context: ./frontend-web
            image: agromaster-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token; packages:write above is all it needs.
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # latest is what the server runs; the SHA tag is the rollback handle.
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
          # Keeps the Maven and npm layers warm between runs.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to EC2
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1
        with:
          # Must be the DuckDNS name: the instance IP changes on every start.
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Stop at the first failed command, so an unhealthy release
            # fails this job instead of ending green on `docker compose ps`.
            set -e
            cd ~/cultivation-help-app
            git pull --ff-only
            docker compose pull -q
            docker compose up -d --remove-orphans
            # Superseded images would otherwise fill the 30 GB disk.
            docker image prune -f
            docker compose ps
