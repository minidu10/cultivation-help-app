# Included into every location that sets its own add_header.
#
# nginx does NOT merge add_header across levels: a location containing any
# add_header discards every header inherited from the server block. Setting
# Cache-Control per location therefore silently dropped all of these, which is
# why they live in one includable file rather than only on the server.

# HSTS: once seen, browsers refuse plain HTTP for this host.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The app is never meant to be framed, so deny it outright (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Google Identity Services needs accounts.google.com for sign-in.
# style-src and font-src must name the Google Fonts hosts: index.html pulls
# Space Grotesk and Inter from fonts.googleapis.com, and the font files
# themselves come from fonts.gstatic.com. Omitting them silently blocked both,
# and every heading fell back to the browser's default serif.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'" always;
