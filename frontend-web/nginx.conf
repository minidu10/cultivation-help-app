server {
    listen 80;
    server_name agromaster.live www.agromaster.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agromaster.live www.agromaster.live;

    ssl_certificate /etc/letsencrypt/live/agromaster.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agromaster.live/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    # HSTS: once seen, browsers refuse plain HTTP for this host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The app is never meant to be framed, so deny it outright (clickjacking).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Google Identity Services needs accounts.google.com for sign-in.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'" always;

    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        set $upstream http://backend:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
