# Strings live in lib/l10n/app_<locale>.arb; `flutter gen-l10n` (run
# automatically by `flutter pub get` and builds) generates AppLocalizations.
# Sinhala and Tamil are added alongside app_en.arb in a later phase.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
